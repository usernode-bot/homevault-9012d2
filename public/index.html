<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return (val.stack || (val.name + ': ' + val.message));
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>HomeVault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230f766e'/><circle cx='50' cy='50' r='34' fill='none' stroke='white' stroke-width='5'/><circle cx='50' cy='50' r='17' fill='white'/><path d='M50 26v10M50 64v10M26 50h10M64 50h10' stroke='white' stroke-width='5' stroke-linecap='round'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css
       on every image build, so the stylesheet is regenerated from THIS
       commit's markup every deploy and can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Never vendor it and never write a hostname in front of it. It is NOT
       conditional on this app calling a bridge API: it is also how the app
       ANSWERS the shell, so a page without it is invisible to anything that
       asks the frame a question. The bridge also reports the viewer's
       light/dark theme, which the script below follows. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- usernode-spec-screens@1: the screen the spec drew. Changed only where
       behaviour needs it: ids and hooks for public/app.js, sample values
       emptied, and the loading, empty and error states added. -->
  <div data-spec-screen="1">
    <div class="hv">
    <div class="top"><h1>HomeVault</h1><span id="hv-username" class="small muted"></span></div>
    <p id="hv-demo-note" class="small muted hv-demo-note" hidden>Staging demo: made-up files to try things on</p>
    <div class="vault" id="vault-meter">
    <svg id="hv-meter-svg" width="96" height="96" viewBox="0 0 96 96" fill="none" stroke-width="4" aria-hidden="true">
    <circle cx="48" cy="48" r="40" stroke="rgb(var(--line))"/>
    <circle id="hv-meter-arc" cx="48" cy="48" r="40" stroke="rgb(var(--amber))" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251" transform="rotate(-90 48 48)"/>
    <circle cx="48" cy="48" r="24" stroke="rgb(var(--muted))" stroke-width="2"/>
    <path d="M48 30v8M48 58v8M30 48h8M58 48h8" stroke="rgb(var(--muted))" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="5" fill="rgb(var(--amber))" stroke="none"/>
    </svg>
    <div><b id="hv-used"><span class="skeleton sk-line sk-used"></span></b><p class="small muted" id="hv-free"><span class="skeleton sk-line sk-free"></span></p><p class="small muted">Uploads stop when the vault is full</p></div>
    </div>
    <button class="btn-primary" id="hv-upload" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span id="hv-upload-label">Upload a file</span></button>
    <input type="file" id="hv-file-input" hidden>
    <p id="hv-msg" class="small hv-msg" hidden role="alert"></p>
    <div id="hv-error" class="state-error" hidden>
      <p>Couldn't open your vault. Your files are safe.</p>
      <button class="btn-secondary" id="hv-retry">Retry</button>
    </div>
    <div id="hv-empty" class="state-empty" hidden>
      <p>Your vault is empty. Upload your first file, up to 100 MB in all.</p>
      <button class="btn-primary" id="hv-empty-upload">Upload a file</button>
    </div>
    <p class="section-label">Your files</p>
    <ul class="list" id="hv-files">
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    </ul>
    <p class="section-label">Shared with you</p>
    <ul class="list" id="hv-shared">
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    <li class="list-row"><span class="ic"><span class="skeleton sk-line sk-ic"></span></span><div class="mid"><p class="n"><span class="skeleton sk-line sk-row"></span></p><p class="tag"><span class="skeleton sk-line sk-tag"></span></p></div></li>
    </ul>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <!-- The share sheet: one file, who can open it, download, delete. -->
  <dialog id="hv-share-sheet" class="hv-sheet">
    <p class="sheet-title" id="hv-share-name"></p>
    <p class="small muted sheet-sub">Who can open it</p>
    <div role="radiogroup" aria-label="Who can open it" id="hv-share-choices">
      <button type="button" class="choice" data-v="only_me">Only you</button>
      <button type="button" class="choice" data-v="members">Vault members<span class="choice-sub">Everyone in this project</span></button>
      <button type="button" class="choice" data-v="public">Public link</button>
    </div>
    <div class="hv-link-row" id="hv-link-row" hidden>
      <input class="field" id="hv-link" readonly aria-label="Public link">
      <button type="button" class="btn-secondary" id="hv-copy">Copy link</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-secondary" id="hv-share-download">Download</button>
      <button type="button" class="btn-secondary sheet-btn-danger" id="hv-share-delete">Delete</button>
      <button type="button" class="btn-secondary" id="hv-share-close">Close</button>
    </div>
  </dialog>
  <!-- The shared-file sheet: download or report someone else's file. -->
  <dialog id="hv-shared-sheet" class="hv-sheet">
    <p class="sheet-title" id="hv-shared-name"></p>
    <p class="small muted sheet-sub" id="hv-shared-meta"></p>
    <div class="sheet-actions">
      <button type="button" class="btn-secondary" id="hv-shared-download">Download</button>
      <button type="button" class="btn-secondary" id="hv-shared-report">Report</button>
      <button type="button" class="btn-secondary" id="hv-shared-close">Close</button>
    </div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
